# Local practice oracle -- test mode (public test key, no token), on localhost:8000.
# Run:  docker compose up -d     then:  export SPELLBREAKER_ORACLE=http://localhost:8000
services:
  oracle:
    # PINNED 2026-09-19. An unpinned :latest shipped an oracle whose routes moved to
    # /{course}/{assignment}/{challenge}/{op}, which 404'd every ward call for an
    # entire section. Repin deliberately after testing the client against a new image.
    image: ghcr.io/agiacalone/grading-oracle@sha256:07f8087668741dd181665d20acf86dd0f15f8bfd3b21861b592344eb45d3747d
    pull_policy: always
    ports:
      - "8000:8000"
    # No GRADING_KEY / GRADING_TOKEN -> the service runs in open TEST mode.
